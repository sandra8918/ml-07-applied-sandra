# ============================================================
# zensical.toml (ALL-COURSE-PY-SRC-REPOS)
# ============================================================
# Updated: 2026-08-02
#
# REQ: Python src/ repositories SHOULD provide documentation configuration.
# WHY: Centralizes project documentation configuration.

[project]
site_name = "ML 07 Applied - Sandra Otubushin"
site_url = "https://sandra8918.github.io/ml-07-applied-sandra/"
repo_url = "https://github.com/sandra8918/ml-07-applied-sandra"
repo_name = "ml-07-applied-sandra"
site_description = "Professional machine learning project investigating a deployed prediction model."
docs_dir = "docs"
site_dir = "site"
edit_uri = "edit/main/docs/"

[project.extra]
# WHY: Social links provide easy access to project repositories and profiles.
social = [
    {icon = "fontawesome/brands/github", link = "https://github.com/sandra8918/ml-07-applied-sandra" },
]

# ------------------------------------------------------------
# Plugins
# ------------------------------------------------------------

[project.plugins.search]
lang = "en"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_toc_entry = true
show_signature_annotations = true
separate_signature = true

[project.theme]
features = [
    "navigation.tracking",
    "navigation.expand",
    "navigation.path",
    "navigation.prune",
    "navigation.indexes",
    "toc.follow",
    "toc.integrate",
    "navigation.top",
]

# ------------------------------------------------------------
# Navigation
# ------------------------------------------------------------
# Use folder-based navigation rather than explicit navigation.
